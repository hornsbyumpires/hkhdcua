media:
  input: src/asset/images/news
  output: ./src/asset/images/news

content:
  - name: news
    label: News & Events
    type: collection
    path: src/content/news
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date]
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Short summary (shown on cards), type: text }
      - { name: image, label: Cover photo, type: image }
      - { name: alt, label: Describe the photo, type: string }
      - { name: gallery, label: Event photos, type: image, list: true }
      - { name: link, type: string, hidden: true }
      - { name: body, label: Article, type: rich-text }